name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      JAVA_MODERNIZE_REQUIRE_JDK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run package, report, inventory and Java fixture checks
        run: python -m unittest discover -s tests -v
      - name: Validate the incomplete report example
        run: python java-modernize/scripts/validate_report.py java-modernize/assets/enterprise-report.example.json
      - name: Build checksummed skill archive
        run: python scripts/package_skill.py
